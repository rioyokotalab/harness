# Persistent session names in the status bar
set -g status-left-length 80
set -g status-left '#[bold]#{session_name} #[default]'

# Do not inherit Codex's non-interactive monochrome environment when a managed
# tmux server is reconstructed from inside an agent process.
set-environment -gu NO_COLOR
set-environment -g COLORTERM truecolor
set-option -ag terminal-features 'xterm*:RGB'

# Navigate sessions
bind-key N switch-client -n
bind-key P switch-client -p

# Browse the complete hierarchy
bind-key Space choose-tree -Zw

# Toggle the selected project pane between overview and full-window zoom
bind-key z resize-pane -Z
