name: Harness CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-phase1:
    name: portable-phase1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HARNESS_PORTABLE_CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record non-secret runner capabilities
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          python3 --version
          cc --version | sed -n '1p'
          c++ --version | sed -n '1p'
          shellcheck --version | sed -n '2p'
      - name: Run exact changed-context gate for pull requests
        if: github.event_name == 'pull_request'
        run: bin/harness validate --stage final --base "${{ github.event.pull_request.base.sha }}"
      - name: Run explicitly requested portable full suite
        if: github.event_name == 'workflow_dispatch'
        run: bin/harness validate --stage final --full --base HEAD^
